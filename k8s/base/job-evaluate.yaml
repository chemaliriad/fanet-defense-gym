# Shard an evaluation across pods: pod i evaluates scenarios i, i+N, i+2N, ... of the suite.
# The union of the shards is exactly the suite (tested in tests/test_scenario.py).
apiVersion: batch/v1
kind: Job
metadata:
  name: fanet-evaluate
  labels:
    app.kubernetes.io/name: fanet-defense
    app.kubernetes.io/component: evaluation
spec:
  completionMode: Indexed
  completions: 8
  parallelism: 4
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fanet-defense
        app.kubernetes.io/component: evaluation
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: evaluate
          image: fanet-defense:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: fanet-evaluate
          # JOB_COMPLETION_INDEX is injected by Kubernetes for Indexed Jobs.
          args:
            - evaluate
            - --n=$(SUITE_SIZE)
            - --split=$(SPLIT)
            - --master-seed=$(MASTER_SEED)
            - --policy=$(POLICY)
            - --shard=$(JOB_COMPLETION_INDEX)
            - --num-shards=$(NUM_SHARDS)
            - --out=/results/shard-$(JOB_COMPLETION_INDEX).json
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: results
              mountPath: /results
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: results
          emptyDir: {}
        - name: tmp
          emptyDir: {}
