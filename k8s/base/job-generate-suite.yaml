# Generate a large scenario suite in parallel: each pod writes one JSONL shard.
apiVersion: batch/v1
kind: Job
metadata:
  name: fanet-generate-suite
  labels:
    app.kubernetes.io/name: fanet-defense
    app.kubernetes.io/component: generation
spec:
  completionMode: Indexed
  completions: 8
  parallelism: 8
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fanet-defense
        app.kubernetes.io/component: generation
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: generate
          image: fanet-defense:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: fanet-evaluate
          args:
            - generate-suite
            - --n=$(GENERATE_SIZE)
            - --split=train
            - --master-seed=$(MASTER_SEED)
            - --shard=$(JOB_COMPLETION_INDEX)
            - --num-shards=$(NUM_SHARDS)
            - --out=/results/train-shard-$(JOB_COMPLETION_INDEX).jsonl
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: results
              mountPath: /results
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: results
          emptyDir: {}
        - name: tmp
          emptyDir: {}
