[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fanet-defense-gym"
version = "0.1.0"
description = "Procedurally generated, partially observable cyber-defense environment for UAV ad hoc networks (Gymnasium and PettingZoo), with baselines, evaluation harness and scale-out tooling."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Riad Chemali" }]
keywords = ["reinforcement-learning", "cybersecurity", "pettingzoo", "gymnasium", "uav", "fanet"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "numpy>=1.26",
    "gymnasium>=1.0",
    "pettingzoo>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = ["torch>=2.2"]
viz = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]
all = ["fanet-defense-gym[train,viz,dev]"]

[project.scripts]
fanet-defense = "fanet_defense.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY", "C4", "RUF"]
ignore = ["RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Report scripts build long human-readable strings (tables, captions).
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: tests that train a policy (deselect with -m 'not slow')"]

[tool.mypy]
python_version = "3.10"
files = ["src/fanet_defense"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
